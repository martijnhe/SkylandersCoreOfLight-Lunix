# Builds the Linux launcher in Valve's Steam Runtime 3 "sniper" SDK (the same as
# tools/build_steamdeck.sh), so the one ZIP runs on the Steam Deck and on other x86_64 Linux, and
# publishes it as a GitHub release:
#
#   push to linux-port   -> pre-release "linux-latest", replaced on every push
#   push of a tag v*     -> release of that tag (the tag must match COREOFLIGHT_VERSION)
#   Actions > Run        -> the same as a push to the branch it runs on
name: Linux release

on:
  push:
    branches: [linux-port]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linux-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Version
        id: version
        run: |
          version=$(sed -n 's/^set(COREOFLIGHT_VERSION "\(.*\)")$/\1/p' CMakeLists.txt)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match COREOFLIGHT_VERSION $version" >&2
            exit 1
          fi

      - name: Build
        run: |
          for v in 14 13 12; do
            if command -v g++-$v >/dev/null 2>&1; then export CC=gcc-$v CXX=g++-$v; break; fi
          done
          echo "compiler: ${CXX:-c++}"
          cmake --preset steamdeck
          cmake --build --preset steamdeck

      - name: Pack
        run: tools/package_linux.sh out/build/steamdeck

      - name: No build machine paths
        run: |
          if strings dist/linux/CoreOfLight/coreoflight | grep -E '/__w/|/home/[a-z]'; then
            echo "build machine paths in the program" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: CoreOfLight-linux-x86_64
          path: dist/CoreOfLight-linux-x86_64-*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CoreOfLight-linux-x86_64
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            tag=${GITHUB_REF_NAME}
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" dist/*.zip --clobber
            else
              gh release create "$tag" dist/*.zip --title "Core of Light $VERSION" \
                --generate-notes --prerelease --verify-tag
            fi
          else
            tag=linux-latest
            gh release delete "$tag" --cleanup-tag --yes 2>/dev/null || true
            gh release create "$tag" dist/*.zip --target "$GITHUB_SHA" --prerelease \
              --title "Core of Light $VERSION (Linux, latest ${GITHUB_REF_NAME})" \
              --notes "Built from ${GITHUB_SHA} on ${GITHUB_REF_NAME}. One ZIP for the Steam Deck and other x86_64 Linux; see README-linux.txt inside."
          fi
